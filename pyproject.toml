[project]
name = "learning-center"
version = "0.1.0"
description = "Private local learning center: math -> ML/LLMs -> information theory -> quantum computing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "sympy>=1.13",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "requests>=2.32",
    "tiktoken>=0.7",
    "qiskit>=1.2",
    "qiskit-aer>=0.15",
    "torch>=2.7",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
